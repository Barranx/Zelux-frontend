<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Zelux Studios</title>

    <link rel="stylesheet" href="auth.css?v=3">
    <script defer src="login.js?v=3"></script>
</head>
<body>

<div class="auth-container glass">
    <h1 class="auth-title">Accedi al tuo Account</h1>

    <!-- LOGIN FORM -->
    <form class="auth-form" onsubmit="loginUser(event)">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" class="auth-btn">Accedi</button>

        <p class="auth-text">
            Non hai un account?
            <a href="register.html" class="gold-link">Registrati</a>
        </p>
    </form>

    <p id="login-error" class="error-msg"></p>
</div>

</body>
</html>
