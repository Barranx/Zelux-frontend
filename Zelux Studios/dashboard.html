<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelux Admin – Dashboard</title>

    <link rel="stylesheet" href="dashboard.css?v=10">
    <script defer src="dashboard.js?v=10"></script>
</head>
<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar glass">
        <div class="brand">
            <img src="img/logo.png" alt="">
            <h2>Zelux Admin</h2>
        </div>

        <nav>
            <a class="active"><span>📊</span> Dashboard</a>
            <a href="#messages"><span>📩</span> Messaggi</a>
            <a><span>⚙️</span> Impostazioni</a>
            <a onclick="logout()"><span>🚪</span> Logout</a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <header class="topbar glass">
            <h1>Dashboard Amministratore</h1>

            <div class="admin-info">
                <img src="img/logo.png" class="admin-avatar">
                <span>Admin</span>
            </div>
        </header>

        <!-- STATISTICHE -->
        <section class="stats">
            <div class="card gold">
                <h3>Messaggi Totali</h3>
                <p id="stat-total">0</p>
            </div>

            <div class="card gold">
                <h3>Messaggi Oggi</h3>
                <p id="stat-today">0</p>
            </div>

            <div class="card gold">
                <h3>Non letti</h3>
                <p id="stat-unread">0</p>
            </div>

            <div class="card gold">
                <h3>Utenti Registrati</h3>
                <p id="stat-users">1</p>
            </div>
        </section>

        <!-- LISTA MESSAGGI ORDINATA -->
        <section id="messages" class="messages glass">
            <h2>📩 Messaggi ricevuti</h2>

            <div class="messages-wrapper" id="messages-container">
                <p class="loading">Caricamento...</p>
            </div>
        </section>

    </main>
</div>

</body>
</html>
