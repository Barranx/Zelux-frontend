<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaggi Clienti – Zelux Studios</title>

    <link rel="stylesheet" href="clienti.css">
</head>
<body>

<div class="dashboard-container">

    <h1 class="page-title">📩 Messaggi clienti</h1>

    <div id="messages-container" class="messages-wrapper">
        <p class="loading">Caricamento messaggi...</p>
    </div>

</div>

<script>
async function loadMessages() {

    const token = localStorage.getItem("token");

    if (!token) {
        alert("Accesso negato – effettua il login.");
        window.location.href = "admin.html";
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:8000/admin/messages", {
            headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
            alert("Permessi insufficienti. Devi essere admin.");
            window.location.href = "admin.html";
            return;
        }

        const messages = await res.json();
        const container = document.getElementById("messages-container");

        container.innerHTML = "";

        if (messages.length === 0) {
            container.innerHTML = "<p class='no-msg'>Nessun messaggio disponibile.</p>";
            return;
        }

        messages.forEach(msg => {
            const card = document.createElement("div");
            card.className = "message-card";

            card.innerHTML = `
                <div class="msg-header">
                    <div class="msg-name">${msg.nome}</div>
                    <div class="msg-email">${msg.email}</div>
                </div>

                <div class="msg-divider"></div>

                <div class="msg-content">${msg.contenuto}</div>

                <div class="msg-date">📅 
                    ${new Date(msg.created_at).toLocaleString()}
                </div>
            `;

            container.appendChild(card);
        });

    } catch (err) {
        console.error("Errore caricamento messaggi:", err);
        alert("Errore di connessione al server.");
    }
}

document.addEventListener("DOMContentLoaded", loadMessages);
</script>

</body>
</html>
