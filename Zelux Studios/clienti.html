<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaggi Clienti – Zelux Studios</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="dashboard glass">
    <h1>📩 Messaggi ricevuti</h1>

    <div id="messages-container">
        <p>Caricamento messaggi...</p>
    </div>
</div>

<script>
async function loadMessages() {
    const token = localStorage.getItem("token");

    if (!token) {
        alert("Non sei loggato!");
        window.location.href = "admin.html";
        return;
    }

    try {
        const res = await fetch("http://127.0.0.1:8000/admin/messages", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!res.ok) {
            alert("Accesso negato. Devi essere admin.");
            window.location.href = "admin.html";
            return;
        }

        const messages = await res.json();
        const container = document.getElementById("messages-container");

        if (messages.length === 0) {
            container.innerHTML = "<p>Nessun messaggio al momento.</p>";
            return;
        }

        container.innerHTML = "";
        messages.forEach(msg => {
            const card = document.createElement("div");
            card.className = "message-card glass";

            card.innerHTML = `
                <h3>${msg.nome} <span style="opacity:0.7;">(${msg.email})</span></h3>
                <p>${msg.contenuto}</p>
                <span class="date">${msg.created_at}</span>
            `;
            container.appendChild(card);
        });

    } catch (err) {
        console.error(err);
        alert("Errore di connessione al server (messaggi).");
    }
}

document.addEventListener("DOMContentLoaded", loadMessages);
</script>

</body>
</html>
