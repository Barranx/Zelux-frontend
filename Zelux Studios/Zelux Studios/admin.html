<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin – Zelux Studios</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="login-container glass">
    <h1 class="title">Area Admin</h1>

    <form id="admin-login-form" onsubmit="adminLogin(event)">
        <input id="admin-email" type="email" placeholder="Email" required>
        <input id="admin-password" type="password" placeholder="Password" required>
        <button type="submit">Accedi</button>
    </form>

    <div id="login-error" style="display:none; color:red;"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
