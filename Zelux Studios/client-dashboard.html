<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Clienti – Zelux Studios</title>

    <!-- CSS Dashboard -->
    <link rel="stylesheet" href="client-dashboard.css?v=3">

    <!-- JS Dashboard -->
    <script defer src="client-dashboard.js?v=3"></script>
</head>
<body>

<div class="layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar glass">
        <div class="brand">
            <img src="img/Disegno1-.png" alt="Zelux Logo" class="brand-logo">
            <h2 class="brand-title">Area Clienti</h2>
        </div>

        <nav id="client-nav" class="sidebar-menu">

            <a class="nav-item active" data-page="profile">
                <span class="icon">👤</span> Profilo
            </a>

            <a class="nav-item" data-page="products">
                <span class="icon">🛍️</span> Prodotti
            </a>

            <a class="nav-item" data-page="cart">
                <span class="icon">🛒</span> Carrello
            </a>

            <a class="nav-item" data-page="orders">
                <span class="icon">📦</span> I miei ordini
            </a>

            <a class="nav-item" data-page="payments">
                <span class="icon">💳</span> Pagamenti
            </a>

            <a class="nav-item" data-page="ticket">
                <span class="icon">🎫</span> Ticket supporto
            </a>

            <a class="nav-item" data-page="quotes">
                <span class="icon">📄</span> Preventivi
            </a>

            <a class="nav-item logout" onclick="logoutClient()">
                <span class="icon">🚪</span> Logout
            </a>

        </nav>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">

        <!-- TOPBAR -->
        <header class="topbar glass">
            <h1 id="page-title">Profilo</h1>

            <div class="user-info">
                <img src="img/user.png" class="user-avatar">
                <span id="user-name">Caricamento...</span>
            </div>
        </header>

        <!-- CONTENUTO -->
        <section id="content-area" class="page-box glass">
            <!-- Questo viene riempito dinamicamente da JS -->
        </section>

    </main>

</div>

</body>
</html>
