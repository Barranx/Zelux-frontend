<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione – Zelux Studios</title>

    <link rel="stylesheet" href="auth.css?v=3">
    <script defer src="auth.js?v=3"></script>
</head>
<body>

<div class="auth-container glass">
    <h1 class="auth-title">Crea un Account</h1>

    <form class="auth-form" onsubmit="registerUser(event)">
        <input type="text" id="reg-name" placeholder="Nome completo" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password" required>

        <button type="submit" class="auth-btn">Registrati</button>

        <p class="auth-text">
            Hai già un account?
            <a href="login.html" class="gold-link">Accedi</a>
        </p>
    </form>

    <p id="register-error" class="error-msg"></p>
</div>

</body>
</html>
